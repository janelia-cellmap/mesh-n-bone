jobqueue:
  lsf:
    ncpus: 8
    processes: 8
    cores: 8
    memory: 120GB
    mem: 120000000000
    # Overwritten at runtime by run_meshify.py with this Fileglancer job's
    # own -W, so a worker can run as long as the driver that waits for it.
    # (1:00 would get the short queue, but a dense block can take longer,
    # and a worker killed at its walltime is never replaced.)
    walltime: "08:00"
    # Workers that lose the driver exit after this many seconds, so they
    # end with it instead of running on to their own walltime.
    death-timeout: 60
    use-stdin: true
    log-directory: job-logs
    name: mesh-n-bone

    # project is overwritten at runtime by run_meshify.py with the
    # Fileglancer job's own project (LSB_PROJECT_NAME) or --lsf-project,
    # and dropped when there is neither. The placeholder is just a marker.
    project: your_project_name

distributed:
  scheduler:
    work-stealing: true

  worker:
    memory:
      target: 0.0
      spill: 0.0
      pause: 0.0
      terminate: 0.0

  admin:
    log-format: '[%(asctime)s] %(levelname)s %(message)s'
    tick:
      interval: 20ms
      limit: 3h
